<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>海报｜改成你的主题</title>
<style>
/* 改这里：品牌色，和 assets/brand.md 保持一致 */
:root{
  --brand:#2f5d50;   /* 主色 */
  --accent:#e9b44c;  /* 强调色：价格、日期 */
  --paper:#f6f3ec;   /* 底色 */
  --ink:#1d1f1e;     /* 文字 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ddd;display:grid;place-items:center;min-height:100vh;padding:40px;font-family:"Source Han Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
.poster{width:1080px;height:1440px;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:88px 84px 72px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:24px;letter-spacing:.16em;font-weight:700}
.top .logo{height:44px}
/* 第一眼：主标题 10 字以内 */
h1{font-size:132px;line-height:1.08;font-weight:900;margin-top:72px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--brand)}
/* 第二眼：给谁、解决什么 */
.sub{font-size:38px;line-height:1.5;margin-top:36px;max-width:820px}
/* 主视觉：换成你的产品图 / 门店照片，放进 assets/ */
.visual{margin:48px -84px 0;flex:1;min-height:0;background:var(--brand) center/cover no-repeat;position:relative}
.visual .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:28px;letter-spacing:.1em}
/* 第三眼：3 个卖点或活动信息 */
.points{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.points div{border-top:4px solid var(--ink);padding-top:18px}
.points b{display:block;font-size:44px;font-weight:900;color:var(--brand)}
.points span{display:block;font-size:24px;margin-top:8px;line-height:1.4}
/* 最后：怎么联系 */
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:48px}
.foot .act{font-size:40px;font-weight:900}
.foot .act small{display:block;font-size:24px;font-weight:400;margin-top:10px}
.foot .qr{width:170px;height:170px;background:#fff;border:2px dashed #999;display:grid;place-items:center;font-size:20px;color:#999}
</style>
</head>
<body>
<div class="poster">
  <div class="top"><span>改成：品牌名</span><span>改成：城市 · 品类</span></div>

  <h1>改成<em>主标题</em><br>十字以内</h1>
  <p class="sub">改成：给谁、解决什么，1–2 行</p>

  <!-- 把 style 里的 url 换成 assets/ 里的图片 -->
  <div class="visual" style="background-image:url('')"><div class="ph">主视觉：产品图 / 门店照片</div></div>

  <div class="points">
    <div><b>00 天</b><span>改成：卖点一</span></div>
    <div><b>免费</b><span>改成：卖点二</span></div>
    <div><b>0 年</b><span>改成：卖点三</span></div>
  </div>

  <div class="foot">
    <div class="act">改成：一个行动<small>电话 / 网址 / 活动时间地点</small></div>
    <div class="qr">二维码</div>
  </div>
</div>
</body>
</html>
